<style>
/* ── Design tokens ── */
:root {
  /* Layout: single-column card feed, sticky header, bottom-tab nav */
  --bg: #0f0f0f;
  --surface: #1a1a1a;
  --surface2: #242424;
  --border: #2e2e2e;
  --fg: #f0f0f0;
  --fg2: #a0a0a0;
  --fg3: #606060;
  --accent: #e8ff47;        /* Jeff Nippard chartreuse */
  --accent-dim: #c8df30;
  --rir0: #ff4545;          /* échec — rouge */
  --rir1: #ff8c42;          /* 1 rep — orange */
  --rir2: #ffd166;          /* 2 reps — jaune */
  --rir3: #5cb85c;          /* 3+ reps — vert */
  --failure: #ff4545;
  --dropset: #a78bfa;
  --myoreps: #38bdf8;
  --integrated: #f472b6;
  --radius: 12px;
  --radius-sm: 8px;
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100%;
  overflow-x: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  font-variant-numeric: tabular-nums;
}

/* Safe area header band */
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 200;
}

/* ── Header ── */
.app-header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 0 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.app-header h1 {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
  flex: 1;
  min-width: 0;
  truncate: ellipsis;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.app-header .accent { color: var(--accent); }

/* ── Week selector ── */
.week-nav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 10px 0 6px;
  -webkit-overflow-scrolling: touch;
}
.week-nav::-webkit-scrollbar { display: none; }

.week-btn {
  flex-shrink: 0;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  background: var(--surface);
  color: var(--fg2);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.week-btn.active {
  background: var(--accent);
  color: #000;
  border-color: transparent;
}
.week-btn.block2 { border-color: #5b21b6; }
.week-btn.block2.active { background: #a78bfa; }

/* ── Day tabs ── */
.day-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.day-tabs::-webkit-scrollbar { display: none; }

.day-tab {
  flex-shrink: 0;
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  background: var(--surface);
  color: var(--fg2);
  border: 1.5px solid var(--border);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.15s;
}
.day-tab.active {
  background: var(--surface2);
  color: var(--fg);
  border-color: var(--accent);
}

/* ── Exercise card ── */
.exo-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}

.exo-header {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 14px 14px 10px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.exo-num {
  min-width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--surface2);
  color: var(--fg2);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 1px;
  flex-shrink: 0;
}

.exo-name {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
  flex: 1;
  min-width: 0;
}

.exo-meta {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.badge {
  font-size: 10px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 10px;
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

.badge-rest { background: #1e3a5f; color: #60a5fa; }
.badge-superset { background: #2d1b4e; color: var(--dropset); }
.badge-type { background: var(--surface2); color: var(--fg2); }

.chevron {
  width: 20px;
  height: 20px;
  flex-shrink: 0;
  color: var(--fg3);
  transition: transform 0.2s;
  margin-top: 2px;
}

.yt-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: #ff0000;
  border-radius: 6px;
  padding: 4px 9px;
  margin: 0 14px 10px 14px;
  text-decoration: none;
  letter-spacing: 0.2px;
  -webkit-tap-highlight-color: transparent;
}
.exo-card.expanded .chevron { transform: rotate(180deg); }

.exo-cue {
  font-size: 12px;
  color: var(--fg2);
  line-height: 1.5;
  padding: 0 14px 12px 48px;
  display: none;
}
.exo-card.expanded .exo-cue { display: block; }

/* ── Sets table ── */
.sets-area {
  padding: 0 10px 12px;
}

.sets-header {
  display: grid;
  grid-template-columns: 28px 1fr 64px 44px 64px 64px;
  gap: 4px;
  padding: 0 4px 6px;
  font-size: 10px;
  font-weight: 700;
  color: var(--fg3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.set-row {
  display: grid;
  grid-template-columns: 28px 1fr 64px 44px 64px 64px;
  gap: 4px;
  align-items: center;
  padding: 5px 4px;
  border-radius: var(--radius-sm);
  margin-bottom: 3px;
  background: var(--surface2);
}

.set-num {
  font-size: 11px;
  font-weight: 700;
  color: var(--fg3);
  text-align: center;
}

.set-type-label {
  font-size: 11px;
  font-weight: 600;
}

.set-reps-target {
  font-size: 12px;
  font-weight: 600;
  color: var(--fg2);
  text-align: center;
}

.rir-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 24px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 800;
  margin: auto;
}
.rir-0 { background: rgba(255,69,69,0.2); color: var(--rir0); }
.rir-01 { background: rgba(255,69,69,0.2); color: var(--rir0); }
.rir-1 { background: rgba(255,140,66,0.2); color: var(--rir1); }
.rir-12 { background: rgba(255,200,80,0.15); color: var(--rir1); }
.rir-2 { background: rgba(255,209,102,0.2); color: var(--rir2); }
.rir-23 { background: rgba(255,209,102,0.2); color: var(--rir2); }
.rir-3 { background: rgba(92,184,92,0.2); color: var(--rir3); }
.rir-34 { background: rgba(92,184,92,0.2); color: var(--rir3); }
.rir-4 { background: rgba(92,184,92,0.2); color: var(--rir3); }
.rir-45 { background: rgba(92,184,92,0.2); color: var(--rir3); }

/* Inputs */
.input-weight, .input-reps {
  width: 100%;
  height: 36px;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  color: var(--fg);
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  text-align: center;
  -webkit-appearance: none;
  padding: 0 4px;
  transition: border-color 0.15s;
  font-variant-numeric: tabular-nums;
}
.input-weight:focus, .input-reps:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--surface2);
}
.input-weight.filled { border-color: #3a5a2a; background: rgba(92,184,92,0.08); color: #8be58b; }
.input-reps.filled { border-color: #3a5a2a; background: rgba(92,184,92,0.08); color: #8be58b; }

/* Set type colors */
.type-standard { color: var(--fg); }
.type-failure { color: var(--failure); }
.type-dropset { color: var(--dropset); }
.type-myoreps { color: var(--myoreps); }
.type-integrated { color: var(--integrated); }
.type-mechanical { color: #f59e0b; }

/* ── Day header ── */
.day-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 12px 0 10px;
}
.day-header h2 {
  font-size: 14px;
  font-weight: 800;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.day-header .day-sub {
  font-size: 12px;
  color: var(--fg3);
  font-weight: 500;
}

/* ── Progress tracker ── */
.progress-bar-wrap {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin: 6px 0 10px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s;
}

/* ── Block label ── */
.block-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--fg3);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 4px 0 2px;
}

/* ── Weak point info ── */
.weak-point-card {
  background: linear-gradient(135deg, #1a1030, #1e1a2e);
  border: 1px solid #3d2b6e;
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
}
.weak-point-card h3 { font-size: 13px; font-weight: 700; color: var(--dropset); margin-bottom: 8px; }
.weak-point-card p { font-size: 12px; color: var(--fg2); line-height: 1.5; }

/* ── Rest day ── */
.rest-day {
  text-align: center;
  padding: 40px 0;
  color: var(--fg3);
  font-size: 14px;
}
.rest-day .rest-icon { font-size: 40px; margin-bottom: 8px; }

/* ── Save button ── */
.save-btn {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  right: max(20px, env(safe-area-inset-right, 0px));
  background: var(--accent);
  color: #000;
  border: none;
  border-radius: 50px;
  padding: 13px 22px;
  font-size: 14px;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(232,255,71,0.35);
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.1s, opacity 0.1s;
  z-index: 50;
}
.save-btn:active { transform: scale(0.96); }
.save-btn.saved { background: #5cb85c; color: #fff; box-shadow: 0 4px 20px rgba(92,184,92,0.3); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2);
  color: var(--fg);
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  opacity: 0;
  transition: all 0.3s;
  pointer-events: none;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── Prev week hint ── */
.prev-hint {
  font-size: 10px;
  color: var(--fg3);
  text-align: center;
  margin-top: 2px;
}

/* ── Scrollable content ── */
.main-content {
  padding-bottom: calc(90px + env(safe-area-inset-bottom, 0px));
}

/* ── Legend ── */
.legend {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 8px 0 4px;
  margin-bottom: 4px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: var(--fg3);
  font-weight: 500;
}
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* ── Semi-deload banner ── */
.deload-banner {
  background: linear-gradient(135deg, #1a2e1a, #1e2e15);
  border: 1px solid #3a5a2a;
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
  font-size: 12px;
  color: #8be58b;
  font-weight: 600;
  text-align: center;
}
</style>

// ── Build full programme structure ────────────────────────────────────
function getWorkout(week, dayIndex) {
  // dayIndex: 0=J1, 1=J2, 2=rest, 3=J3, 4=J4, 5=J5, 6=rest
  if (dayIndex === 2 || dayIndex === 6) return null;
  const isBlock2 = week >= 6;
  if (!isBlock2) {
    if (dayIndex === 0) return BLOCK1_DAY1[Math.min(week, 5)];
    if (dayIndex === 1) return BLOCK1_DAY2[Math.min(week, 5)];
    if (dayIndex === 3) return mkDay3B1(week);
    if (dayIndex === 4) return mkDay4B1(week);
    if (dayIndex === 5) return mkDay5B1(week);
  } else {
    if (dayIndex === 0) return mkBlock2Day1(week);
    if (dayIndex === 1) return mkBlock2Day2(week);
    if (dayIndex === 3) return mkBlock2Day3(week);
    if (dayIndex === 4) return mkBlock2Day4(week);
    if (dayIndex === 5) return mkBlock2Day5(week);
  }
  return [];
}

// ── State ──────────────────────────────────────────────────────────────
let state = { week: 1, day: 0, expanded: {} };
let stored = {};

function storageKey(week, day, exoIdx, setIdx, field) {
  return `fb1_w${week}_d${day}_e${exoIdx}_s${setIdx}_${field}`;
}

function loadStored() {
  try {
    const raw = localStorage.getItem('fb1_data');
    if (raw) stored = JSON.parse(raw);
  } catch(e) { stored = {}; }
}

function saveStored() {
  try { localStorage.setItem('fb1_data', JSON.stringify(stored)); } catch(e) {}
}

function getVal(week, day, exoIdx, setIdx, field) {
  const k = storageKey(week, day, exoIdx, setIdx, field);
  return stored[k] || '';
}

function setVal(week, day, exoIdx, setIdx, field, value) {
  const k = storageKey(week, day, exoIdx, setIdx, field);
  stored[k] = value;
}

// ── RIR rendering ─────────────────────────────────────────────────────
function rirClass(rir) {
  const r = String(rir).replace(/\s/g,'');
  if (r === '0') return 'rir-0';
  if (r === '0-1') return 'rir-01';
  if (r === '1') return 'rir-1';
  if (r === '1-2') return 'rir-12';
  if (r === '2') return 'rir-2';
  if (r === '2-3') return 'rir-23';
  if (r === '3') return 'rir-3';
  if (r === '3-4') return 'rir-34';
  if (r === '4') return 'rir-4';
  if (r === '4-5') return 'rir-45';
  if (r === '5') return 'rir-3';
  return 'rir-3';
}

function typeClass(type) {
  if (type === FAIL) return 'type-failure';
  if (type === DROP) return 'type-dropset';
  if (type === MYO) return 'type-myoreps';
  if (type === INT) return 'type-integrated';
  if (type === MECH) return 'type-mechanical';
  return 'type-standard';
}

function typeShort(type) {
  if (type === STD) return 'Standard';
  if (type === FAIL) return '⚡ Failure';
  if (type === DROP) return '⬇ Dropset';
  if (type === MYO) return '🔁 Myo-reps';
  if (type === INT) return '✂ Integrated';
  if (type === MECH) return '🔧 Mech Drop';
  return type;
}

// ── Render ─────────────────────────────────────────────────────────────
function renderWeekNav() {
  const nav = document.getElementById('week-nav');
  nav.innerHTML = '';
  for (let w = 1; w <= 10; w++) {
    const btn = document.createElement('button');
    btn.className = `week-btn${w >= 6 ? ' block2' : ''}${state.week === w ? ' active' : ''}`;
    btn.textContent = `S${w}`;
    btn.onclick = () => { state.week = w; state.day = 0; render(); };
    nav.appendChild(btn);
  }
}

function renderDayTabs() {
  const tabs = document.getElementById('day-tabs');
  tabs.innerHTML = '';
  DAY_LABELS.forEach((label, i) => {
    const tab = document.createElement('button');
    tab.className = `day-tab${state.day === i ? ' active' : ''}`;
    tab.textContent = label;
    tab.onclick = () => { state.day = i; renderContent(); renderDayTabs(); };
    tabs.appendChild(tab);
  });
}

function renderContent() {
  const content = document.getElementById('day-content');
  const { week, day } = state;

  const isRest = day === 2 || day === 6;
  if (isRest) {
    content.innerHTML = `<div class="rest-day"><div class="rest-icon">😴</div>Jour de repos obligatoire<br><small style="color:var(--fg3);margin-top:4px;display:block">Récupère bien pour la prochaine séance !</small></div>`;
    return;
  }

  const workout = getWorkout(week, day);
  if (!workout || workout.length === 0) {
    content.innerHTML = '<div class="rest-day"><div class="rest-icon">🏋️</div>Données en cours de chargement...</div>';
    return;
  }

  const weekInfo = WEEKS[week];
  let html = '';

  // Semi-deload banner
  if (weekInfo.semiDeload) {
    html += `<div class="deload-banner">🌿 SEMI-DELOAD — Évite l'échec et allège les charges pour favoriser la récupération avant le prochain bloc !</div>`;
  }

  // Day header
  html += `<div class="day-header"><h2>${DAYS[day]}</h2><span class="day-sub">${DAY_FULL[day]}</span></div>`;

  // Legend
  html += `<div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--rir3)"></div>RIR 3+</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--rir2)"></div>RIR 2</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--rir1)"></div>RIR 1</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--rir0)"></div>Échec</div>
  </div>`;

  // Weak point card for day 5
  if (day === 5) {
    html += `<div class="weak-point-card">
      <h3>🎯 Tableau des Points Faibles</h3>
      <p><strong>Épaules :</strong> Cuffed Lateral Raise / Machine Shoulder Press<br>
      <strong>Dorsaux :</strong> Cable Lat Prayer / Lat-Focused Cable Row<br>
      <strong>Quadriceps :</strong> Leg Extension / Single-Leg Leg Press<br>
      <strong>Fessiers :</strong> Machine Hip Abduction / Barbell Hip Thrust<br>
      <strong>Pectoraux :</strong> Low Incline DB Flye / Chest Press Machine<br>
      <strong>Cou :</strong> Plate-Loaded Neck Curls / Head Harness</p>
    </div>`;
  }

  // Exercises
  workout.forEach((exercise, exoIdx) => {
    const expKey = `${week}_${day}_${exoIdx}`;
    const isExpanded = state.expanded[expKey];

    const supersetBadge = exercise.superset ? `<span class="badge badge-superset">Superset ${exercise.superset.toUpperCase()}</span>` : '';
    const restBadge = exercise.rest ? `<span class="badge badge-rest">⏱ ${exercise.rest}</span>` : '';
    const optBadge = exercise.optional ? `<span class="badge" style="background:#2d2210;color:#f59e0b">Optionnel</span>` : '';
    const warmBadge = exercise.warmup ? `<span class="badge badge-type">🔥 ${exercise.warmup}</span>` : '';

    html += `<div class="exo-card${isExpanded ? ' expanded' : ''}" id="exo_${expKey}">
      <div class="exo-header" onclick="toggleExo('${expKey}')">
        <div class="exo-num">${exoIdx + 1}</div>
        <div style="flex:1;min-width:0">
          <div class="exo-name">${exercise.name}</div>
          <div class="exo-meta">${supersetBadge}${restBadge}${warmBadge}${optBadge}</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </div>`;

    const ytUrl = YT[exercise.name];
    if (ytUrl) html += `<a class="yt-btn" href="${ytUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">▶ YouTube</a>`;

    if (isExpanded && exercise.cue) {
      html += `<div class="exo-cue">${exercise.cue}${exercise.sub1 ? `<br><span style="color:var(--fg3)">Sub: ${exercise.sub1}${exercise.sub2 ? ' / ' + exercise.sub2 : ''}</span>` : ''}</div>`;
    }

    html += `<div class="sets-area">
      <div class="sets-header">
        <span>S.</span><span>Type</span><span>Reps</span><span>RIR</span><span>Poids</span><span>Reps</span>
      </div>`;

    exercise.sets.forEach((set, setIdx) => {
      const weight = getVal(week, day, exoIdx, setIdx, 'w');
      const reps = getVal(week, day, exoIdx, setIdx, 'r');
      const prevWeight = getVal(week - 1, day, exoIdx, setIdx, 'w');
      const prevReps = getVal(week - 1, day, exoIdx, setIdx, 'r');

      html += `<div class="set-row">
        <div class="set-num">${setIdx + 1}</div>
        <div class="set-type-label ${typeClass(set.type)}">${typeShort(set.type)}</div>
        <div class="set-reps-target">${set.reps}</div>
        <div><span class="rir-badge ${rirClass(set.rir)}">${set.rir}</span></div>
        <div>
          <input type="number" inputmode="decimal" pattern="[0-9]*\.?[0-9]*"
            class="input-weight${weight ? ' filled' : ''}"
            placeholder="${prevWeight ? '▶'+prevWeight : 'kg'}"
            value="${weight}"
            onchange="handleInput(${week},${day},${exoIdx},${setIdx},'w',this)"
            onfocus="this.select()">
        </div>
        <div>
          <input type="number" inputmode="numeric" pattern="[0-9]*"
            class="input-reps${reps ? ' filled' : ''}"
            placeholder="${prevReps ? '▶'+prevReps : 'reps'}"
            value="${reps}"
            onchange="handleInput(${week},${day},${exoIdx},${setIdx},'r',this)"
            onfocus="this.select()">
        </div>
      </div>`;

      if (prevWeight || prevReps) {
        html += `<div class="prev-hint">S${week-1} : ${prevWeight || '—'} kg × ${prevReps || '—'}</div>`;
      }
    });

    html += `</div></div>`;
  });

  content.innerHTML = html;
}

function toggleExo(key) {
  state.expanded[key] = !state.expanded[key];
  const card = document.getElementById(`exo_${key}`);
  if (card) {
    card.classList.toggle('expanded', !!state.expanded[key]);
    // Re-render cue area
    const [week, day, exoIdx] = key.split('_').map(Number);
    const workout = getWorkout(week, day);
    if (!workout) return;
    const exercise = workout[exoIdx];
    let cueEl = card.querySelector('.exo-cue');
    if (state.expanded[key]) {
      if (!cueEl && exercise.cue) {
        const cueDiv = document.createElement('div');
        cueDiv.className = 'exo-cue';
        cueDiv.innerHTML = `${exercise.cue}${exercise.sub1 ? `<br><span style="color:var(--fg3)">Sub: ${exercise.sub1}${exercise.sub2 ? ' / ' + exercise.sub2 : ''}</span>` : ''}`;
        card.querySelector('.exo-header').after(cueDiv);
      }
    }
  }
}

function handleInput(week, day, exoIdx, setIdx, field, el) {
  setVal(week, day, exoIdx, setIdx, field, el.value);
  if (el.value) el.classList.add('filled');
  else el.classList.remove('filled');
}

function render() {
  renderWeekNav();
  document.getElementById('week-label').textContent = `W${state.week}/10`;
  document.getElementById('block-label').textContent = WEEKS[state.week].block.toUpperCase();
  document.getElementById('progress-bar').style.width = `${(state.week / 10) * 100}%`;
  renderDayTabs();
  renderContent();
}

function saveSession() {
  saveStored();
  const btn = document.getElementById('save-btn');
  btn.textContent = '✅ Sauvegardé';
  btn.classList.add('saved');
  showToast('Séance sauvegardée !');
  setTimeout(() => {
    btn.textContent = '💾 Sauvegarder';
    btn.classList.remove('saved');
  }, 2000);
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// ── Auto-save on input ──────────────────────────────────────────────
document.addEventListener('change', (e) => {
  if (e.target.classList.contains('input-weight') || e.target.classList.contains('input-reps')) {
    saveStored();
  }
});

// ── Wake lock ──────────────────────────────────────────────────────────
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(() => {});
}

// ── Init ───────────────────────────────────────────────────────────────
loadStored();
render();
</script>

</body></html>
